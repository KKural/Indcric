{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto p-6 bg-white rounded shadow-md">
    {% if message %}
    <div
        class="mb-4 p-4 {% if success %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %} rounded">
        {{ message }}
    </div>
    {% endif %}

    {% if user %}
    <form method="post" action="{% url 'edit_user' user.id %}">
        {% csrf_token %}
        <h2 class="text-xl font-bold mb-4">Edit User</h2>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="username">Username</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="username" name="username" type="text" placeholder="Username" value="{{ user.username }}">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="email">Email</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="email" name="email" type="email" placeholder="Email" value="{{ user.email }}">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="role">Role</label>
            <select
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="role" name="role">
                <option value="batsman" {% if user.role=='batsman' %}selected{% endif %}>Batsman</option>
                <option value="bowler" {% if user.role=='bowler' %}selected{% endif %}>Bowler</option>
                <option value="allrounder" {% if user.role=='allrounder' %}selected{% endif %}>All-rounder</option>
            </select>
        </div>

        <!-- Player Ratings -->
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-3">Player Ratings (1–10)</label>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="batting_rating">🏏 Batting</label>
                        <span class="text-indigo-600 font-bold text-sm" id="batting_val">{{ user.batting_rating
                            }}</span>
                    </div>
                    <input type="range" id="batting_rating" name="batting_rating" min="1" max="10" step="0.5"
                        value="{{ user.batting_rating }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('batting_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="bowling_rating">🎳 Bowling</label>
                        <span class="text-indigo-600 font-bold text-sm" id="bowling_val">{{ user.bowling_rating
                            }}</span>
                    </div>
                    <input type="range" id="bowling_rating" name="bowling_rating" min="1" max="10" step="0.5"
                        value="{{ user.bowling_rating }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('bowling_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="fielding_rating">🧤 Fielding</label>
                        <span class="text-indigo-600 font-bold text-sm" id="fielding_val">{{ user.fielding_rating
                            }}</span>
                    </div>
                    <input type="range" id="fielding_rating" name="fielding_rating" min="1" max="10" step="0.5"
                        value="{{ user.fielding_rating }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('fielding_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="wallet_amount">Wallet
                Amount</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="wallet_amount" name="wallet_amount" type="number" step="0.01" placeholder="Wallet Amount"
                value="{{ wallet_amount }}">
        </div>

        <div class="mb-4">
            <div class="flex items-center">
                <input class="mr-2" type="checkbox" id="is_staff" name="is_staff" value="True" {% if user.is_staff
                    %}checked{% endif %}>
                <label class="text-gray-700 text-sm !inline-block" for="is_staff">Staff User</label>
            </div>
        </div>

        <div class="mb-6">
            <div class="flex items-center">
                <input class="mr-2" type="checkbox" id="is_superuser" name="is_superuser" value="True" {% if
                    user.is_superuser %}checked{% endif %}>
                <label class="text-gray-700 text-sm !inline-block" for="is_superuser">Admin User</label>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <button
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="submit">
                Save Changes
            </button>
            <a href="{% url 'manage-users' %}"
                class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                Cancel
            </a>
        </div>
    </form>
    {% endif %}
</div>
{% endblock %}
