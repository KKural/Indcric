{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="mb-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold">Create New User</h2>
    </div>

    {% if message %}
    <div
        class="mb-4 p-4 {% if success %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %} rounded">
        {{ message }}
    </div>
    {% endif %}

    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="username">Username*</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="username" name="username" type="text" placeholder="Username (login name)"
                value="{{ username|default:'' }}" required>
        </div>

        <div class="mb-4 grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="first_name">First
                    Name*</label>
                <input
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    id="first_name" name="first_name" type="text" placeholder="First name"
                    value="{{ first_name|default:'' }}" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="last_name">Last
                    Name</label>
                <input
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    id="last_name" name="last_name" type="text" placeholder="Last name"
                    value="{{ last_name|default:'' }}">
            </div>
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="email">Email</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="email" name="email" type="email" placeholder="Email" value="{{ email|default:'' }}">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="password">Password*</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="password" name="password" type="password" placeholder="Password" required>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="role">Role</label>
            <select
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="role" name="role">
                <option value="batsman" {% if role=='batsman' %}selected{% endif %}>Batsman</option>
                <option value="bowler" {% if role=='bowler' %}selected{% endif %}>Bowler</option>
                <option value="allrounder" {% if role=='allrounder' %}selected{% endif %}>All-rounder</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2 !inline-block" for="wallet_amount">Wallet
                Amount</label>
            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="wallet_amount" name="wallet_amount" type="number" step="0.01" placeholder="0.00"
                value="{{ wallet_amount|default:'0.00' }}">
        </div>

        <div class="mb-4">
            <div class="flex items-center">
                <input class="mr-2" type="checkbox" id="is_staff" name="is_staff" {% if is_staff %}checked{% endif %}>
                <label class="text-gray-700 text-sm !inline-block" for="is_staff">Staff User</label>
            </div>
        </div>

        <div class="mb-6">
            <div class="flex items-center">
                <input class="mr-2" type="checkbox" id="is_superuser" name="is_superuser" {% if is_superuser %}checked{%
                    endif %}>
                <label class="text-gray-700 text-sm !inline-block" for="is_superuser">Admin User</label>
            </div>
        </div>

        <!-- Player Ratings -->
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-3">Player Ratings (1–10)</label>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="batting_rating">🏏 Batting</label>
                        <span class="text-indigo-600 font-bold text-sm" id="batting_val">{{ batting_rating|default:'5'
                            }}</span>
                    </div>
                    <input type="range" id="batting_rating" name="batting_rating" min="1" max="10" step="0.5"
                        value="{{ batting_rating|default:'5' }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('batting_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="bowling_rating">🎳 Bowling</label>
                        <span class="text-indigo-600 font-bold text-sm" id="bowling_val">{{ bowling_rating|default:'5'
                            }}</span>
                    </div>
                    <input type="range" id="bowling_rating" name="bowling_rating" min="1" max="10" step="0.5"
                        value="{{ bowling_rating|default:'5' }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('bowling_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-gray-600 text-sm" for="fielding_rating">🧤 Fielding</label>
                        <span class="text-indigo-600 font-bold text-sm" id="fielding_val">{{ fielding_rating|default:'5'
                            }}</span>
                    </div>
                    <input type="range" id="fielding_rating" name="fielding_rating" min="1" max="10" step="0.5"
                        value="{{ fielding_rating|default:'5' }}" class="w-full accent-indigo-600"
                        oninput="document.getElementById('fielding_val').textContent = this.value">
                    <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1 Weak</span><span>10
                            Elite</span></div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <button
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="submit">Create User</button>
            <a class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800"
                href="{% url 'manage-users' %}">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
